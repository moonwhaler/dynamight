[package]
name = "dynamight"
version = "1.0.1"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "limit", "set-header"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Authentication
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"

# TOTP / 2FA
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# Scheduling
cron = "0.12"

# Rate limiting
dashmap = "6"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
once_cell = "1"
glob = "0.3"
url = "2"

# Configuration
toml = "0.8"

# Async utilities
futures = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

# File type detection
mime_guess = "2"

# Directory walking
walkdir = "2"

# Encryption for credentials
aes-gcm = "0.10"
sha2 = "0.10"

# Encryption for config backup (OpenSSL-compatible AES-256-CBC)
pbkdf2 = "0.12"
cbc = "0.1"
aes = "0.8"
hmac = "0.12"

# Cloud providers
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"

# SFTP
russh = "0.46"
russh-sftp = "2"
russh-keys = "0.46"

# HTTP client (for WebDAV)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Unix process signals
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

# Error handling
anyhow = "1"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
axum-test = "16"
