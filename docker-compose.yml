services:
  dynamight:
    image: ghcr.io/moonwhaler/dynamight:latest
    container_name: dynamight
    restart: unless-stopped

    # On stop, running backups get 20 s to cancel cleanly (kill rsync,
    # unmount USB drives). The default of 10 s would kill them first.
    stop_grace_period: 30s

    # Required for mount operations
    cap_add:
      - SYS_ADMIN

    # Required for /dev access (USB devices)
    privileged: false
    devices:
      - /dev:/dev

    ports:
      - "8080:8080"

    volumes:
      # Configuration file (create from dynamight.toml.example first; without
      # create_host_path: false, Docker would create an empty directory instead)
      - type: bind
        source: ./dynamight.toml
        target: /app/config/dynamight.toml
        read_only: true
        bind:
          create_host_path: false

      # Persistent data (database)
      - dynamight-data:/app/data

      # Logs
      - dynamight-logs:/app/logs

      # Mount points (required for actual backups)
      # The :rshared flag allows mount propagation from container to host
      - /mnt:/mnt:rshared

      # Source directories to back up
      # Add your source directories here - these will be read-only accessible in the container
      # Examples:
      # - /home:/source/home:ro
      # - /etc:/source/etc:ro
      # - /var/www:/source/www:ro

    environment:
      # These env vars override values in dynamight.toml
      # Useful for secrets or per-deployment overrides
      - RUST_LOG=${RUST_LOG:-info,dynamight=debug}
      # Schedules use server.timezone from dynamight.toml. TZ overrides it,
      # so only set it to change the timezone without editing the file:
      # - TZ=Europe/Berlin
      # Uncomment to override jwt_secret from config file:
      # - JWT_SECRET=${JWT_SECRET}

    # Security options
    security_opt:
      - no-new-privileges:true
      # Hosts with AppArmor (Ubuntu, Debian) block mount in containers by
      # default. If mounting USB drives fails with "permission denied", add:
      # - apparmor=unconfined

    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  dynamight-data:
  dynamight-logs:
